# jabr/classifier-benchmark v2, Persian states with the original English questions.
[[task]]
id = "support_department_v2_fas"
type = "choice"

[task.question]
instructions = "Which team should handle this support message?"

[task.question.criteria]
billing = "Refunds, payments, invoices, subscriptions, or unexpected charges"
tech = "Bugs, errors, crashes, downtime, or integration failures"
sales = "Pricing questions, quotes, upgrades, demos, or new purchases"
account = "Login issues, password resets, profile changes, or data deletion requests"
other = "Anything that does not match the other categories"

[[task.cases]]
state = "گوشی‌ام را گم کرده‌ام و نمی‌توانم کدهای 2FA را دریافت کنم، برای همین دسترسی‌ام به حساب کاربری‌ام قفل شده است."
expected = "account"

[[task.cases]]
state = "آیا برای پرداخت سالانه در پلن Business تخفیفی وجود دارد؟"
expected = "sales"

[[task.cases]]
state = "بعد از اینکه ماه گذشته اشتراکمان را لغو کردیم، از کارتمان مبلغ 49.99 دلار کسر شده است — لطفاً آن را برگردانید."
expected = "billing"

[[task.cases]]
state = "از زمانی که events API را فعال کرده‌ایم، یکپارچه‌سازی Slack هر اعلان را دو بار ارسال می‌کند."
expected = "tech"

[[task.cases]]
state = "ما در حال مقایسه‌ی شما با Acme برای 200 کاربر هستیم. می‌توانید لطفاً وایت‌پیپر امنیتی را برایمان بفرستید و یک تماس با یک مهندس راهکار هماهنگ کنید؟"
expected = "sales"

[[task.cases]]
state = "لطفاً مالکیت workspace سازمانمان را به یکی از همکارانم که قرار است جای من را بگیرد منتقل کنید."
expected = "account"

[[task.cases]]
state = "ما سال گذشته اعتبار API اضافه خریدیم که هیچ‌وقت استفاده نشد؛ آیا می‌شود آن را بازپرداخت کرد یا به حساب ما اعتبار داد؟"
expected = "billing"

[[task.cases]]
state = "هشدارهای ورود از کشور دیگری می‌بینم و فکر می‌کنم حسابم ممکن است هک شده باشد. لطفاً به من کمک کنید آن را ایمن کنم."
expected = "account"

[[task.cases]]
state = "این گزارش باگ نیست، فقط یک آرزوست: آیا امکانی هست که حالت تاریک (dark mode) در نقشه‌ی راه باشد؟"
expected = "other"

[[task.cases]]
state = "اشتراک ما هفته‌ی آینده به‌صورت خودکار تمدید می‌شود و می‌خواهیم پیش از آن متوقف شود."
expected = "billing"

[[task.cases]]
state = "از وقتی نشان وضعیت (status badge) سایتمان را با ویجت جدید شما عوض کردیم، دیگر به‌روزرسانی نمی‌شود."
expected = "tech"

[[task.cases]]
state = "آیا برای ویزای کاری در استکهلم حمایت (اسپانسر) می‌کنید؟ از یکی از همکاران سابقم که آنجا بوده، تعریف‌های خوبی شنیده‌ام."
expected = "other"

[[task.cases]]
state = "آیا برای 50 کاربر سفارش خرید (purchase order) می‌پذیرید؟ ما به شرایط پرداخت net-30 نیاز داریم."
expected = "sales"

[[task.cases]]
state = "از زمان بازه‌ی نگهداری (maintenance window) تاکنون، هر درخواست به api.acme.com خطای 403 برمی‌گرداند، اما فقط برای سازمان ما."
expected = "tech"

[[task.cases]]
state = "شناسه‌ی مالیات بر ارزش افزوده (VAT ID) ما در سه فاکتور آخر درج نشده است؛ بخش مالی ما به نسخه‌های اصلاح‌شده نیاز دارد."
expected = "billing"

[[task.cases]]
state = "باید پیش از جلسه‌ی آشناسازی (onboarding) روز دوشنبه 30 کاربر دیگر اضافه کنیم — می‌توانید امروز قیمت‌های به‌روز را برایمان بفرستید؟"
expected = "sales"

[[task.cases]]
state = "در فاکتور یک مورد با عنوان «platform fee» دیده می‌شود که قبلاً هرگز ندیده بودیم — این هزینه برای چیست؟"
expected = "billing"

[[task]]
id = "email_intent_v2_fas"
type = "choice"

[task.question]
instructions = "What is the main intent of this email?"

[task.question.criteria]
meeting_request = "They want to schedule a meeting or call"
question = "They are asking a question that needs an answer"
complaint = "They are complaining about a problem or expressing dissatisfaction"
thanks = "They are expressing gratitude or appreciation"
fyi = "They are just sharing information without asking for anything"

[[task.cases]]
state = "بابت بررسی دقیقتان ممنونم! می‌شود پنجشنبه 30 دقیقه وقت بگذاریم و بازخوردها را با هم مرور کنیم؟"
expected = "meeting_request"

[[task.cases]]
state = "یک سؤال کوتاه: آیا طرح سازمانی (enterprise) شامل SSO می‌شود یا قیمت آن جدا محاسبه می‌شود؟"
expected = "question"

[[task.cases]]
state = "باید صادقانه بگویم، انتظار داشتیم اطلاع‌رسانی بیشتری درباره‌ی عرضه‌ی نسخه انجام شود — ما خبر تغییر API را فقط از طریق یکی از مشتریان شنیدیم."
expected = "complaint"

[[task.cases]]
state = "از اینکه درباره‌ی خروجی سفارشی با زمان‌بندی ما همکاری کردید سپاسگزاریم؛ تیم واقعاً قدردان این لطف بود."
expected = "thanks"

[[task.cases]]
state = "نیازی به پاسخ نیست — فقط خواستم اطلاع بدهم که محیط staging روز شنبه از ساعت 02:00 تا 06:00 به دلیل تعمیر و نگهداری برنامه‌ریزی‌شده از دسترس خارج خواهد بود."
expected = "fyi"

[[task.cases]]
state = "هیئت مدیره پایلوت را تأیید کرد، پس برای راه‌اندازی چراغ سبز داریم — دعوت‌نامه‌ی جلسه‌ی شروع پروژه باید همین حالا در تقویم شما باشد."
expected = "fyi"

[[task.cases]]
state = "هر وقت فرصت کردید: قرارداد ما در مارس خودکار تمدید می‌شود یا در آوریل؟"
expected = "question"

[[task.cases]]
state = "داشبورد از جمعه تا الان اعداد اشتباه نشان می‌دهد و تا حالا دو بار مجبور شده‌ام این مغایرت را برای مدیرعامل‌مان توضیح بدهم."
expected = "complaint"

[[task.cases]]
state = "بیایید هفته‌ی آینده 45 دقیقه وقت پیدا کنیم تا اعداد Q3 را مرور کنیم — چند بازه‌ی زمانی برای دستیار شما می‌فرستم."
expected = "meeting_request"

[[task.cases]]
state = "از رفع سریع تیکت 5501 ممنونم؛ بعد از آن استقرار (deploy) بدون مشکل انجام شد."
expected = "thanks"

[[task.cases]]
state = "این سومین فاکتور این فصل است که شماره‌ی PO آن اشتباه تایپی دارد؛ حسابداری هر بار آن‌ها را رد می‌کند."
expected = "complaint"

[[task.cases]]
state = "حالا که فرصتی پیش آمده — محدودیت نرخ درخواست API به ازای هر سازمان است یا به ازای هر کلید؟"
expected = "question"

[[task.cases]]
state = "دمِ کسی که فیلترهای ذخیره‌شده را منتشر کرد گرم؛ همین حالا هفته‌ای یک ساعت در وقتم صرفه‌جویی شده."
expected = "thanks"

[[task.cases]]
state = "بودجه‌ی هیئت مدیره تأیید شد — SOW امضاشده پیوست است و از طرف شما اقدامی لازم نیست."
